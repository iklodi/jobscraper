# Weights for the composite job score (scoring.py). Each factor is scored
# 0-100 by the model; the composite is sum(weight * factor) / sum(default) / 10.
# Override any of this in CVS_DIR/scoring_weights.yaml.
default:
  role_fit: 22
  seniority: 13
  experience: 10
  skills: 10
  industry: 5
  location: 20        # heavily: a job in the wrong place rarely makes up for it
  salary: 8
  language: 6
  employer: 3
  growth: 3

# Per-model sets, so the score means the same whichever model answers
# (scoring.py): the default weights scaled factor by factor to the models'
# common average, then as a whole so that every model passes the same share
# of the same jobs at one mark. Fitted 2026-11-06 on 100 jobs scored by all
# six models below, 51 of which passed under the old 1-10 scores; with these
# sets each model passes about 51 of them at MIN_PASS_SCORE=6.41
# (python scoring.py --fit ... --pass-share 0.51). A model not listed uses
# the default weights, uncalibrated.
